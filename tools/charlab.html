<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Character lab</title>
  <style>
    html, body { margin: 0; height: 100%; background: #10202a; color: #e8eef2; font: 13px/1.3 system-ui, sans-serif; overflow: hidden; }
    canvas { display: block; width: 100vw; height: 100vh; }
    #labels { position: fixed; inset: 0; pointer-events: none; display: grid; grid-template-columns: repeat(var(--cols, 3), 1fr); grid-template-rows: repeat(var(--rows, 2), 1fr); }
    #labels div { padding: 8px 10px; border: 1px solid #ffffff14; }
    #labels b { display: inline-block; background: #0b1a22cc; padding: 3px 8px; border-radius: 6px; }
    #bar { position: fixed; right: 10px; bottom: 10px; display: flex; gap: 6px; }
    #bar button { background: #0b1a22cc; color: #fff; border: 1px solid #ffffff30; border-radius: 6px; padding: 5px 9px; cursor: pointer; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="labels"></div>
  <div id="bar"></div>
  <script type="module" src="./charlab.js"></script>
</body>
</html>
